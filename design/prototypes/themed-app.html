<style>
/* ==========================================================================
   家庭仓管日历 · 多主题原型
   架构：组件只读语义令牌（CSS 变量）；每套主题 = 一个 [data-theme] 令牌块。
   换主题 = 换 html 上的 data-theme，不动任何组件代码。
   ========================================================================== */
:root{
  /* —— 令牌契约（每套主题都必须定义；下面这份是 swiss 默认值兜底） —— */
  --bg:#F1F3F5; --bg-deco:none; --surface:#FFFFFF; --surface-2:#F7F8F9;
  --border:#E3E7EA; --border-w:1px; --border-strong:#C9D0D6;
  --text:#0F172A; --text-2:#334155; --text-3:#5B6472; --on-primary:#FFFFFF;
  --primary:#0F172A; --primary-soft:#EDEFF2; --accent:#047857; --accent-soft:#ECFDF5;
  --warn:#B45309; --warn-soft:#FFFBEB; --danger:#B91C1C; --danger-soft:#FEF2F2;
  --success:#047857; --success-soft:#ECFDF5; --info:#1D4ED8; --info-soft:#EFF6FF;
  --radius-card:12px; --radius-ctl:8px; --radius-pill:999px;
  --shadow-card:none; --shadow-ctl:none; --shadow-press:none; --glow:none;
  --font-head:'Plus Jakarta Sans',system-ui,sans-serif; --font-body:'Plus Jakarta Sans',system-ui,sans-serif; --font-mono:ui-monospace,monospace;
  --fs-h1:24px; --fs-h2:12px; --label-transform:uppercase; --label-tracking:.12em;
  --gap:12px; --pad:16px; --ctl-h:44px; --dur:.18s; --ease:ease;
  --icon-stroke:1.75; --icon-cap:round; --clip-card:none; --nav-bg:rgba(255,255,255,.96);
  color-scheme:light;
  --scrim: rgba(8,12,20,.45); --swatch-border: rgba(0,0,0,.18); --badge-text: #FFFFFF;
  --shadow-sheet: 0 -16px 40px -24px rgba(0,0,0,.6);
  --nav-fg: #5B6472; --nav-fg-active: #0F172A;
}

/* ========================== 组件（只读令牌） ========================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); background-image:var(--bg-deco); background-size:14px 14px, auto;
  color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
.app{max-width:430px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative}
header{padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) 10px; background:var(--surface);
  backdrop-filter:blur(10px); border-bottom:var(--border-w) solid var(--border)}
.brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
.brand{font-family:var(--font-head); font-weight:700; font-size:13px; letter-spacing:var(--label-tracking); text-transform:var(--label-transform)}
.brand em{font-style:normal; color:var(--accent)}
.themebtn{min-height:var(--ctl-h); min-width:var(--ctl-h); padding:0 12px; display:inline-flex; align-items:center; gap:6px;
  border:var(--border-w) solid var(--border); background:var(--surface-2); color:var(--text-2); border-radius:var(--radius-ctl);
  box-shadow:var(--shadow-ctl); font:inherit; font-size:12px; font-weight:600; cursor:pointer}
.themebtn:active{box-shadow:var(--shadow-press)}
.dots8{display:inline-flex; gap:3px}
.dots8 i{width:8px;height:8px;border-radius:50%;display:block}
h1.page{font-family:var(--font-head); font-size:var(--fs-h1); margin:10px 0 0; line-height:1.2; font-weight:700}
.hd-sub{font-size:12px; color:var(--text-3); margin-top:4px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); margin-top:var(--gap)}
.stat{background:var(--surface-2); border:var(--border-w) solid var(--border); border-radius:var(--radius-card); padding:10px 12px}
.stat b{display:block; font-family:var(--font-head); font-size:24px; line-height:1.1; font-variant-numeric:tabular-nums}
.stat span{font-size:11px; color:var(--text-3); letter-spacing:var(--label-tracking); text-transform:var(--label-transform)}
.stat.warn{background:var(--warn-soft)} .stat.ok{background:var(--success-soft)}
main{flex:1; overflow-y:auto; padding:var(--pad) var(--pad) 108px}
section[hidden]{display:none}
.block{margin-bottom:20px}
.block-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px}
.block-head h2{font-family:var(--font-head); font-size:var(--fs-h2); margin:0; letter-spacing:var(--label-tracking); text-transform:var(--label-transform)}
.block-head small{font-size:11.5px; color:var(--text-3)}
.card{background:var(--surface); border:var(--border-w) solid var(--border); border-radius:var(--radius-card);
  box-shadow:var(--shadow-card); clip-path:var(--clip-card); backdrop-filter:blur(14px); overflow:hidden}
.hero{padding:var(--pad); border:var(--border-w) solid var(--border); border-radius:var(--radius-card); background:var(--primary-soft);
  box-shadow:var(--shadow-card); clip-path:var(--clip-card)}
.hero .k{font-size:11px; letter-spacing:var(--label-tracking); text-transform:var(--label-transform); color:var(--text-3)}
.hero .t{font-family:var(--font-head); font-size:20px; font-weight:700; margin:6px 0 2px; line-height:1.25}
.hero .s{font-size:13px; color:var(--text-2)}
.row{display:flex; align-items:center; gap:10px; width:100%; min-height:var(--ctl-h); padding:10px 12px; text-align:left;
  background:transparent; color:inherit; font:inherit; cursor:pointer; border:0; border-bottom:var(--border-w) solid var(--border)}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.thumb{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;border-radius:var(--radius-ctl);
  border:var(--border-w) solid var(--border); background:var(--surface-2); font-family:var(--font-head); font-weight:700; font-size:15px}
.g{flex:1; min-width:0}

  { id:'glass',    name:'极光玻璃',   desc:'浅色通透 · 毛玻璃层次',    sw:['#EAF2FF','#1D4ED8','#0E9F6E','#FFC9DE'] }
];
function themeById(id){ for (var i=0;i<THEMES.length;i++){ if(THEMES[i].id===id) return THEMES[i]; } return THEMES[0]; }
function applyTheme(id, quiet){
  var t = themeById(id);
  document.documentElement.setAttribute('data-theme', t.id);
  $('#themeName').textContent = t.name;
  $('#themeDots').innerHTML = t.sw.slice(0,4).map(function(c){ return '<i style="background:'+c+'"></i>'; }).join('');
  try { localStorage.setItem('homeops-theme', t.id); } catch(e) {}
  var cards = document.querySelectorAll('.tcard');
  for (var i=0;i<cards.length;i++){ cards[i].setAttribute('aria-pressed', cards[i].dataset.tid===t.id ? 'true':'false'); }
  if(!quiet) toast('已切换到「'+t.name+'」');
}
function openThemeSheet(){
  var w = el('div');
  var h = el('h3', null, '选择主题'); h.id='sheetTitle';
  w.appendChild(h);
  w.appendChild(el('p','note','全部主题共用同一套组件与语义令牌，切换只改 design token，不改功能代码。点一下即时预览。'));
  var grid = el('div','themegrid');
  THEMES.forEach(function(t){
    var b = el('button','tcard'); b.type='button'; b.dataset.tid=t.id;
    b.setAttribute('aria-pressed', document.documentElement.getAttribute('data-theme')===t.id ? 'true':'false');
    b.innerHTML = '<span class="sw5">'+t.sw.map(function(c){ return '<i style="background:'+c+'"></i>'; }).join('')+'</span>'+
      '<b>'+t.name+'</b><small>'+t.desc+'</small>';
    b.addEventListener('click', function(){ applyTheme(t.id); });
    grid.appendChild(b);
  });
  w.appendChild(grid);
  var sys = el('p','note','当前：' + themeById(document.documentElement.getAttribute('data-theme')).name + '；选择会记住，下次打开还是它。');
  w.appendChild(sys);
  openSheet([w]);
}

/* ============================ 工具 ============================ */
function $(s, r){ return (r||document).querySelector(s); }
function el(t, c, x){ var n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; }
function p2(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function daysTo(s){ return Math.round((new Date(s+'T00:00:00') - new Date(iso(TODAY)+'T00:00:00'))/86400000); }
function expText(s){ var n=daysTo(s); if(n<0) return '过期 '+(-n)+' 天'; if(n===0) return '今天到期'; if(n===1) return '明天到期'; return '还剩 '+n+' 天'; }
function expPill(s){ var n=daysTo(s); return n<=1 ? 'p-danger' : (n<=7 ? 'p-warn' : 'p-success'); }
function firstExp(i){ var e=null; i.batches.forEach(function(b){ if(!e||b.exp<e) e=b.exp; }); return e; }
function ic(id, cls){ return '<svg class="ic '+(cls||'')+'" aria-hidden="true"><use href="#'+id+'"/></svg>'; }
var toastTimer;
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('open'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('open'); }, 1800); }

/* ============================ 今日 ============================ */
function renderToday(){
  var exp = ITEMS.filter(function(i){ return i.qty>0 && firstExp(i) && daysTo(firstExp(i))<=7; })
                 .sort(function(a,b){ return firstExp(a)<firstExp(b) ? -1 : 1; });
  var low = ITEMS.filter(function(i){ return i.qty<=i.thr; });
  var open = TASKS.filter(function(t){ return !t.done && t.due<=iso(TODAY); });
  $('#kExp').textContent = exp.length; $('#kLow').textContent = low.length; $('#kTask').textContent = open.length;
  $('#cToday').textContent = exp.length ? String(exp.length) : '';
  $('#cTask').textContent = open.length ? String(open.length) : '';
  $('#hdSub').textContent = '9 月 21 日 周一 · ' + open.length + ' 件事要做';
  $('#expMeta').textContent = exp.length ? (exp.length + ' 项 · 按到期日排') : '暂无';
  var w = exp[0];
  if (w){ $('#heroTitle').textContent = '先吃掉那 ' + w.qty + ' ' + w.unit + w.name;
          $('#heroSub').textContent = expText(firstExp(w)) + ' · ' + w.loc + ' · 处理掉就不浪费'; }
  else { $('#heroTitle').textContent = '冰箱很干净'; $('#heroSub').textContent = '这周没有临期的东西'; }

  var le = $('#listExp'); le.innerHTML='';
  if (!exp.length) le.appendChild(el('div','note','暂时没有临期物品。'));
  exp.forEach(function(i){
    var b = el('button','row'); b.type='button';
    b.innerHTML = '<span class="thumb">'+i.name.slice(0,1)+'</span>'+
      '<span class="g"><span class="n">'+i.name+' · '+i.qty+' '+i.unit+'</span>'+
      '<span class="s">'+i.loc+' · '+expText(firstExp(i))+' · '+i.batches.length+' 个批次</span></span>'+
      '<span class="pill '+expPill(firstExp(i))+'">'+expText(firstExp(i))+'</span>'+
      '<span class="pill p-success" data-role="done">已处理</span>';
    b.setAttribute('aria-label', i.name+'，'+expText(firstExp(i))+'，查看批次');
    b.addEventListener('click', function(e){
      if (e.target.dataset.role==='done'){ i.qty=Math.max(0,i.qty-1); renderAll(); toast('已登记处理 1 '+i.unit+'：'+i.name); return; }
      openItem(i);
    });
    le.appendChild(b);
  });

  var ll = $('#listLow'); ll.innerHTML='';
  if (!low.length) ll.appendChild(el('div','note','库存都在阈值之上。'));
  low.forEach(function(i){
    var b = el('button','row'); b.type='button';
    b.innerHTML = '<span class="thumb">'+i.name.slice(0,1)+'</span>'+
      '<span class="g"><span class="n">'+i.name+'</span><span class="s">'+i.loc+' · 现有 '+i.qty+' '+i.unit+' · 阈值 '+i.thr+'</span></span>'+
      '<span class="pill p-danger">需要买</span><span class="pill p-info" data-role="cart">加入清单</span>';
    b.addEventListener('click', function(e){
      if (e.target.dataset.role==='cart'){ toast('已加入购物清单：'+i.name); e.stopPropagation(); return; }
      openItem(i);
    });
    ll.appendChild(b);
  });
}

/* ============================ 日历 ============================ */
var selDate = iso(TODAY);
function renderCal(){
  var y=TODAY.getFullYear(), m=TODAY.getMonth();
  $('#calMonth').textContent = y + ' 年 ' + p2(m+1) + ' 月';
  var start=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate(), prev=new Date(y,m,0).getDate();
  var g=$('#calGrid'); g.innerHTML='';
  for (var i=start-1;i>=0;i--){ var d=el('div','day',String(prev-i)); d.setAttribute('aria-hidden','true'); g.appendChild(d); }
  for (var dd=1; dd<=days; dd++){
    var ds = y+'-'+p2(m+1)+'-'+p2(dd);
    var evs = EVENTS.filter(function(e){ return e.date===ds; });
    var b = el('button','day'); b.type='button';
    var marks = '<span class="dm">'+evs.slice(0,3).map(function(e){ return '<i style="background:'+TYPE_VAR[e.type]+'"></i>'; }).join('')+'</span>';
    b.innerHTML = '<span>'+dd+'</span>'+marks;
    b.setAttribute('aria-label',(m+1)+'月'+dd+'日，'+evs.length+' 个事件'+(ds===iso(TODAY)?'，今天':''));
    if (ds===iso(TODAY)) b.classList.add('today');
    if (ds===selDate) b.classList.add('sel');
    b.addEventListener('click', function(ds2){ return function(){ selDate=ds2; renderCal(); }; }(ds));
    g.appendChild(b);
  }
  var tail=(7-((start+days)%7))%7;
  for (var t=1;t<=tail;t++){ var d2=el('div','day',String(t)); d2.setAttribute('aria-hidden','true'); g.appendChild(d2); }
  renderDay();
}
function renderDay(){
  var evs = EVENTS.filter(function(e){ return e.date===selDate; });
  $('#dayHead').textContent = selDate.slice(5).replace('-','月')+'日 事件';
  $('#dayCount').textContent = evs.length ? evs.length+' 条' : '空';
  var box=$('#listDay'); box.innerHTML='';
  if (!evs.length){ box.appendChild(el('div','note','这一天没有安排。')); return; }
  evs.forEach(function(e){
    var r=el('div','row');
    r.innerHTML='<span class="thumb">'+ic('i-leaf')+'</span>'+
      '<span class="g"><span class="n">'+e.title+'</span><span class="s">'+e.date+'</span></span>'+
      '<span class="pill '+TYPE_PILL[e.type]+'">'+(e.type==='expiry'?'临期':e.type==='buy'?'采购':e.type==='chore'?'家务':'耗材')+'</span>';
    box.appendChild(r);
  });
}

/* ============================ 库存 ============================ */
var locFilter='全部', kw='';
function renderChips(){
  var box=$('#locChips'); box.innerHTML='';
  ['全部'].concat(LOCS).forEach(function(l){
    var b=el('button','chip',l); b.type='button'; b.setAttribute('aria-pressed', locFilter===l?'true':'false');
    b.addEventListener('click', function(){ locFilter=l; renderStock(); });
    box.appendChild(b);
  });
}
function renderStock(){
  renderChips();
  var list = ITEMS.filter(function(i){
    return (locFilter==='全部'||i.loc===locFilter) && (kw===''||i.name.indexOf(kw)>=0||i.loc.indexOf(kw)>=0||i.cat.indexOf(kw)>=0);
  }).sort(function(a,b){ var ea=firstExp(a)||'9999', eb=firstExp(b)||'9999'; return ea<eb?-1:1; });
  var box=$('#listItems'); box.innerHTML='';
  if (!list.length) box.appendChild(el('div','note','没有匹配的物品。'));
  list.forEach(function(i){
    var e=firstExp(i);
    var b=el('button','row'); b.type='button';
    b.innerHTML='<span class="thumb">'+i.name.slice(0,1)+'</span>'+
      '<span class="g"><span class="n">'+i.name+'</span><span class="s">'+i.loc+' · '+i.cat+(i.batches.length?' · '+i.batches.length+' 个批次':' · 无批次')+'</span></span>'+
      '<span class="qty">'+i.qty+'<small>'+i.unit+'</small></span>'+
      '<span class="pill '+(i.qty<=i.thr?'p-danger':(e?expPill(e):'p-plain'))+'">'+(i.qty<=i.thr?'缺货':(e?expText(e):'无批次'))+'</span>';
    b.addEventListener('click', function(){ openItem(i); });
    box.appendChild(b);
  });
  $('#stockNote').textContent = '共 '+list.length+' 项；默认 FEFO（先过期先出）排序。';
}

/* ============================ 待办 ============================ */
function taskRow(t){
  var r=el('div','tog'); r.setAttribute('role','checkbox'); r.setAttribute('tabindex','0'); r.setAttribute('aria-checked', t.done?'true':'false');
  r.innerHTML='<span class="sw"><i></i></span><span class="g"><span class="n">'+t.title+'</span>'+
    '<span class="s">'+t.src+' · '+(t.cycle?t.cycle+' · ':'')+'截止 '+t.due.slice(5).replace('-','/')+'</span></span>'+
    '<span class="pill '+(t.src==='临期处理'?'p-warn':t.src==='库存联动'?'p-info':'p-accent')+'">'+t.src+'</span>';
  function tg(){ t.done=!t.done; renderAll(); toast(t.done?'已完成：'+t.title:'已恢复：'+t.title); }
  r.addEventListener('click', tg);
  r.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); tg(); } });
  return r;
}
function renderTasks(){
  var groups=[['#listToday', TASKS.filter(function(t){return t.kind==='today';})],
              ['#listChore', TASKS.filter(function(t){return t.kind==='chore';})],
              ['#listLinked',TASKS.filter(function(t){return t.kind==='linked';})]];
  $('#mToday').textContent = TASKS.filter(function(t){return t.kind==='today'&&!t.done;}).length+' 项未完成';
  groups.forEach(function(g){
    var box=$(g[0]); box.innerHTML='';
    if (!g[1].length) box.appendChild(el('div','note','暂无。'));
    g[1].forEach(function(t){ box.appendChild(taskRow(t)); });
  });
}

/* ============================ 抽屉 ============================ */
function openSheet(nodes){
  var s=$('#sheet'), b=$('#sheetBody'); b.innerHTML=''; nodes.forEach(function(n){ b.appendChild(n); });
  s.hidden=false; requestAnimationFrame(function(){ s.classList.add('open'); $('#scrim').classList.add('open'); });
  $('#scrim').addEventListener('click', closeSheet, { once:true });
}
function closeSheet(){
  var s=$('#sheet'); s.classList.remove('open'); $('#scrim').classList.remove('open');
  setTimeout(function(){ s.hidden=true; }, 200);
}
function openItem(i){
  var w=el('div');
  var h=el('h3',null,i.name); h.id='sheetTitle';
  w.appendChild(h);
  w.appendChild(el('p','note', i.loc+' · '+i.cat+' · 现有 '+i.qty+' '+i.unit+'（阈值 '+i.thr+'）'));
  if (i.batches.length){
    i.batches.slice().sort(function(a,b){ return a.exp<b.exp?-1:1; }).forEach(function(b){
      var kv=el('div','kv');
      kv.innerHTML='<span>'+b.no+' · 到期 '+b.exp+'</span><span>'+b.qty+' '+i.unit+'</span>';
      w.appendChild(kv);
    });
  } else { w.appendChild(el('p','note','还没有批次，先入库才会产生库存。')); }
  var bs=el('div','btnrow'); bs.style.marginTop='14px';
  var bi=el('button','btn'); bi.type='button'; bi.innerHTML=ic('i-in')+'<span>入库 +1</span>';
  var bo=el('button','btn'); bo.type='button'; bo.innerHTML=ic('i-out')+'<span>领用 -1</span>';
  var bc=el('button','btn soft'); bc.type='button'; bc.innerHTML=ic('i-x')+'<span>关闭</span>';
  bi.addEventListener('click', function(){
    if (i.batches.length) i.batches[0].qty+=1;
    else i.batches.push({ no:'B-'+iso(TODAY).slice(2).replace(/-/g,''), exp:'2027-09-21', qty:1, price:0 });
    i.qty+=1; renderAll(); openItem(i); toast('入库 1 '+i.unit+'：'+i.name);
  });
  bo.addEventListener('click', function(){
    if (i.qty<=0){ toast('库存已经是 0'); return; }
    i.qty-=1;
    for (var k=0;k<i.batches.length;k++){ if (i.batches[k].qty>0){ i.batches[k].qty-=1; break; } }
    renderAll(); openItem(i); toast('领用 1 '+i.unit+'：'+i.name);
  });
  bc.addEventListener('click', closeSheet);
  bs.appendChild(bi); bs.appendChild(bo); bs.appendChild(bc);
  w.appendChild(bs);
  w.appendChild(el('p','note','真实实现：一次请求同时写 stock_transactions 与批次数量，带幂等键；库存归零自动生成「买 + 换」两条待办。'));
  openSheet([w]);
}
function openQuickAdd(){
  var w=el('div');
  var h=el('h3',null,'快速录入'); h.id='sheetTitle';
  w.appendChild(h); w.appendChild(el('p','note','手动兜底入口：名称必填，其余可后补。'));
  var f=el('div'); f.style.marginTop='10px';
  f.innerHTML='<div class="kv"><span>名称</span><span><input id="qaName" placeholder="例如 酸奶" style="font:inherit;text-align:right;border:0;border-bottom:var(--border-w) solid var(--border);background:transparent;color:var(--text);width:150px"></span></div>'+
    '<div class="kv"><span>数量</span><span><input id="qaQty" type="number" value="1" min="1" style="font:inherit;text-align:right;border:0;border-bottom:var(--border-w) solid var(--border);background:transparent;color:var(--text);width:150px"></span></div>'+
    '<div class="kv"><span>放哪儿</span><span><select id="qaLoc" style="font:inherit;background:var(--surface);color:var(--text);border:var(--border-w) solid var(--border);border-radius:var(--radius-ctl);padding:4px">'+LOCS.map(function(l){return '<option>'+l+'</option>';}).join('')+'</select></span></div>'+
    '<div class="kv"><span>到期日</span><span><input id="qaExp" type="date" value="2026-10-01" style="font:inherit;background:var(--surface);color:var(--text);border:var(--border-w) solid var(--border);border-radius:var(--radius-ctl);padding:4px"></span></div>';
  w.appendChild(f);
  var go=el('button','btn primary'); go.type='button'; go.textContent='入库'; go.style.width='100%'; go.style.marginTop='14px';
  go.addEventListener('click', function(){
    var n=($('#qaName')).value.trim(); if(!n){ toast('名称不能为空'); return; }
    var qy=Number(($('#qaQty')).value)||1, ex=($('#qaExp')).value;
    ITEMS.push({ id:Date.now(), name:n, loc:($('#qaLoc')).value, qty:qy, unit:'个', cat:'未分类', thr:0,
      batches:[{ no:'B-'+iso(TODAY).slice(2).replace(/-/g,''), exp:ex, qty:qy, price:0 }] });
    EVENTS.push({ date:ex, type:'expiry', title:n+' 到期' });
    closeSheet(); renderAll(); toast('已入库：'+n+' '+qy+' 个');
  });
  w.appendChild(go);
  var cc=el('button','btn soft'); cc.type='button'; cc.textContent='取消'; cc.style.width='100%'; cc.style.marginTop='10px';
  cc.addEventListener('click', closeSheet); w.appendChild(cc);
  openSheet([w]);
}

/* ============================ 导航 / 初始化 ============================ */
var TITLES = { today:'今日', cal:'日历', stock:'库存', task:'待办' };
document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    var v=tab.dataset.v;
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t===tab?'true':'false'); });
    ['today','cal','stock','task'].forEach(function(k){ $('#v-'+k).hidden = (k!==v); });
    $('#pageTitle').textContent = TITLES[v];
    $('#main').scrollTop = 0;
  });
});
document.querySelectorAll('[data-act]').forEach(function(b){
  b.addEventListener('click', function(){
    if (b.dataset.act==='manual') openQuickAdd();
    else toast(b.dataset.act==='voice' ? '语音录入是 P1，还没接上' : '扫码是 P1，先手动输入吧');
  });
});
$('#themeBtn').addEventListener('click', openThemeSheet);
$('#q').addEventListener('input', function(e){ kw=e.target.value.trim(); renderStock(); });
document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeSheet(); });

function renderAll(){ renderToday(); renderCal(); renderStock(); renderTasks(); }
var saved=null;
try { saved = localStorage.getItem('homeops-theme'); } catch(e) {}
var hashMatch = /theme=([a-z]+)/.exec(location.hash || '');
applyTheme((hashMatch && hashMatch[1]) || saved || 'swiss', true);
renderAll();

</script>
